server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression (crucial for people.json and wiki_summaries.json)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Cache static hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Dataset files: allow disk caching but always revalidate ETag/Last-Modified (304 Not Modified)
    location /data/ {
        etag on;
        add_header Cache-Control "public, no-cache";
    }

    # SPA fallback (never cache index.html so new deployments take effect immediately)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
